spring:
  kafka:
    consumer:
      group-id: order-group
  data:
    mongodb:
      database: orders
      authentication-database: admin
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    hibernate:
      ddl-auto: update

server:
  port: 8082

sentry:
  logging:
    minimum-event-level: info
