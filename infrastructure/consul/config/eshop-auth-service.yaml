spring:
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

sentry:
  logging:
    minimum-event-level: warn

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health, httpexchanges, prometheus
