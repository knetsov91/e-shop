version: '3.7'

services:

  # --- Infrastructure ---

  traefik:
    image: traefik:v3.4
    depends_on:
      - consul
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./traefik/traefik-dev.yml:/etc/traefik/traefik.yml
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml
      - ./logs:/logs

  consul:
    container_name: consul
    image: hashicorp/consul
    command: agent -server -bootstrap-expect=1 -data-dir=/consul/data -ui -client=0.0.0.0
    ports:
      - "8500:8500"
    volumes:
      - consul_data:/consul/data

  kafka:
    image: apache/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # --- Databases ---

  user-service-db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${USER_SERVICE_DB_USERNAME}
      POSTGRES_PASSWORD: ${USER_SERVICE_DB_PASSWORD}
      POSTGRES_DB: ${USER_SERVICE_DB}
    volumes:
      - user_service_db:/var/lib/postgresql/data

  order-service-db:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${ORDER_SERVICE_DB_USERNAME}
      POSTGRES_PASSWORD: ${ORDER_SERVICE_DB_PASSWORD}
      POSTGRES_DB: ${ORDER_SERVICE_DB}
    volumes:
      - order_service_db:/var/lib/postgresql/data

  inventory-service-db:
    image: postgres:16
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${INVENTORY_SERVICE_DB_USERNAME}
      POSTGRES_PASSWORD: ${INVENTORY_SERVICE_DB_PASSWORD}
      POSTGRES_DB: ${INVENTORY_SERVICE_DB}
    volumes:
      - inventory_service_db:/var/lib/postgresql/data

  mongodb:
    image: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db

  # --- Services ---

  user-service:
    build: ../eshop-user-service
    image: eshop-user-service
    env_file: .env
    depends_on:
      - consul
      - user-service-db
    environment:
      - CONSUL_URL=consul
      - USER_SERVICE_DB_HOST=user-service-db
      - USER_SERVICE_DB_PORT=5432

  product-service:
    build: ../eshop-product-service
    image: eshop-product-service
    env_file: .env
    depends_on:
      - consul
      - mongodb
    environment:
      - CONSUL_URL=consul
      - ORDER_SERVICE_QUERY_DB_HOST=mongodb

  order-service:
    build: ../eshop-order-service
    image: eshop-order-service
    env_file: .env
    depends_on:
      - consul
      - order-service-db
      - mongodb
      - kafka
    environment:
      - CONSUL_URL=consul
      - ORDER_SERVICE_DB_HOST=order-service-db
      - ORDER_SERVICE_DB_PORT=5432
      - ORDER_SERVICE_QUERY_DB_HOST=mongodb
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - AUTH_SERVICE_JWK_URI=http://user-service:8088/oauth2/jwks

volumes:
  user_service_db:
  order_service_db:
  inventory_service_db:
  mongodb_data:
  consul_data:
