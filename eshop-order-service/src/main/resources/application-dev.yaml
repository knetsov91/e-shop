spring:
  application:
    name: eshop-order-service

  config:
    import: "optional:consul:"

  data:
    mongodb:
      database: orders
      username:  ${ORDER_SERVICE_QUERY_DB_USERNAME}
      authentication-database: admin
      password: ${ORDER_SERVICE_QUERY_DB_PASSWORD}
      host: ${ORDER_SERVICE_QUERY_DB_HOST:localhost}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-group
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

        format_sql: true
    hibernate:
      ddl-auto: update

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${ORDER_SERVICE_DB_HOST}:${ORDER_SERVICE_DB_PORT}/${ORDER_SERVICE_DB}
    username: ${ORDER_SERVICE_DB_USERNAME}
    password: ${ORDER_SERVICE_DB_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_JWK_URI}

  cloud:
    consul:
      host: ${CONSUL_URL:localhost}
      port: 8500
      config:
        enabled: false
      discovery:
        enabled: true
        health-check-path: /actuator/health
        register: true
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${random.value}
        tags:
          - traefik.enable=true
          - traefik.http.routers.eshop-order-service.rule=PathPrefix(`/api/v1/orders`)
          - traefik.http.services.eshop-order-service.loadbalancer.server.port=8082
          - traefik.http.routers.eshop-order-service.middlewares=rate-limit@file

sentry:
  dsn: ${SENTRY_DSN}
  traces-sample-rate: 1.0
  logs:
    enabled: true
  logging:
    minimum-event-level: warn
    minimum-breadcrumb-level: info

server:
  port: 8082



management:
  endpoints:
    web:
      exposure:
        include: health, prometheus