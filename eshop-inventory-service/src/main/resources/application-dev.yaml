spring:
  application:
    name: eshop-inventory-service

  config:
    import: "optional:consul:"

  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    hibernate:
      ddl-auto: update

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${INVENTORY_SERVICE_DB_HOST}:${INVENTORY_SERVICE_DB_PORT}/${INVENTORY_SERVICE_DB}
    username: ${INVENTORY_SERVICE_DB_USERNAME}
    password: ${INVENTORY_SERVICE_DB_PASSWORD}

server:
  port: 8086
