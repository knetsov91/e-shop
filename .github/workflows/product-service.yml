name: Product Service

on:
  push:
    branches: [dev, main]
    paths:
      - 'eshop-product-service/**'
  pull_request:
    branches: [dev, main]
    paths:
      - 'eshop-product-service/**'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Run tests
        run: ./gradlew test
        working-directory: eshop-product-service
